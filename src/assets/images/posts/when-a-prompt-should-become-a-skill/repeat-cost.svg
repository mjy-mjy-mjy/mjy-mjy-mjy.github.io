<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">重复任务中交代成本与执行成本的变化示意</title>
<desc id="desc">示意图：前三次协作中，交代任务的成本几乎不下降；把规范沉淀下来需要一次额外投入，之后每一次的交代成本大幅降低。</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#183153" flood-opacity=".08"/>
  </filter>
</defs>
<rect width="1400" height="720" rx="34" fill="#f8fafc"/>
<text x="700" y="68" text-anchor="middle" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#14213d">被重复消耗的是哪一部分</text>
<text x="700" y="108" text-anchor="middle" font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#6b7890">示意，不是实测数据：执行成本每次都在，交代成本本可以只付一次</text>

<g font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#526178">
  <rect x="392" y="146" width="20" height="20" rx="5" fill="#8fabdd"/>
  <text x="422" y="163">执行成本</text>
  <rect x="552" y="146" width="20" height="20" rx="5" fill="#c3b4f2"/>
  <text x="582" y="163">交代与确认成本</text>
  <rect x="782" y="146" width="20" height="20" rx="5" fill="#e9a469"/>
  <text x="812" y="163">一次性的沉淀成本</text>
</g>

<line x1="170" y1="640" x2="1310" y2="640" stroke="#cbd6e4" stroke-width="2"/>

<g filter="url(#shadow)">
  <rect x="240" y="460" width="130" height="180" rx="7" fill="#8fabdd"/>
  <rect x="240" y="310" width="130" height="146" rx="7" fill="#c3b4f2"/>
</g>
<g filter="url(#shadow)">
  <rect x="530" y="470" width="130" height="170" rx="7" fill="#8fabdd"/>
  <rect x="530" y="330" width="130" height="136" rx="7" fill="#c3b4f2"/>
</g>
<g filter="url(#shadow)">
  <rect x="820" y="470" width="130" height="170" rx="7" fill="#8fabdd"/>
  <rect x="820" y="330" width="130" height="136" rx="7" fill="#c3b4f2"/>
  <rect x="820" y="238" width="130" height="88" rx="7" fill="#e9a469"/>
</g>
<g filter="url(#shadow)">
  <rect x="1110" y="470" width="130" height="170" rx="7" fill="#8fabdd"/>
  <rect x="1110" y="434" width="130" height="32" rx="7" fill="#c3b4f2"/>
</g>

<g font-family="Inter,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">
  <text x="305" y="676" font-size="20" font-weight="700" fill="#17233d">第一次</text>
  <text x="305" y="704" font-size="16" fill="#6b7890">从零交代，理所当然</text>
  <text x="595" y="676" font-size="20" font-weight="700" fill="#17233d">第二次</text>
  <text x="595" y="704" font-size="16" fill="#6b7890">感觉到重复，还能忍</text>
  <text x="885" y="676" font-size="20" font-weight="700" fill="#17233d">第三次</text>
  <text x="885" y="704" font-size="16" fill="#6b7890">多花一次，把规则写下来</text>
  <text x="1175" y="676" font-size="20" font-weight="700" fill="#17233d">之后每一次</text>
  <text x="1175" y="704" font-size="16" fill="#6b7890">只剩这一次的具体要求</text>
</g>

<path d="M980 282 C1030 282 1060 420 1104 448" fill="none" stroke="#e0a877" stroke-width="3" stroke-dasharray="7 9"/>
<path d="M1104 448l-14-9 3 12z" fill="#e0a877"/>
</svg>
