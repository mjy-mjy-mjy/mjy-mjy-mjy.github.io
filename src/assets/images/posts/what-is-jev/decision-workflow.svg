<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1000" viewBox="0 0 840 1000" role="img" aria-labelledby="title desc"><title id="title">Jev、代码与 LLM 怎样分工</title><desc id="desc">示例工单流程：上下文进入 Jev，代码结合判断、规则、权限与阈值，将任务分流到确定性处理、LLM 起草或人工复核。LLM 草稿需要校验。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#648477"/></marker></defs><rect width="840" height="1000" rx="24" fill="#f3f6f0"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" fill="#193f38">
<text x="40" y="53" font-size="20" fill="#193f38" font-weight="700" text-anchor="start">03 / AGENT WORKFLOW</text>
<text x="40" y="102" font-size="34" fill="#193f38" font-weight="700" text-anchor="start">模型提供判断，代码控制执行</text>
<text x="40" y="146" font-size="26" fill="#61766c" font-weight="400" text-anchor="start">工单分流设计示意 · 非实测系统</text>
<rect x="155" y="183" width="625" height="78" rx="16" fill="#fffefa" stroke="#cfdbcf"/>
<text x="468" y="232" font-size="29" fill="#193f38" font-weight="700" text-anchor="middle">用户消息 + 查询记录</text>
<rect x="155" y="295" width="625" height="92" rx="16" fill="#193f38" stroke="#cfdbcf"/>
<text x="468" y="331" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">Jev · 语义判断</text>
<text x="468" y="368" font-size="24" fill="#dcecdf" font-weight="400" text-anchor="middle">类别、程度、概率与不确定性</text>
<rect x="155" y="425" width="625" height="100" rx="16" fill="#fffefa" stroke="#cfdbcf"/>
<text x="468" y="461" font-size="29" fill="#193f38" font-weight="700" text-anchor="middle">代码 · 校验与分流</text>
<text x="468" y="498" font-size="24" fill="#61766c" font-weight="400" text-anchor="middle">结合规则、权限与经过评估的阈值</text>
<path d="M468 261V285" fill="none" stroke="#648477" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M468 387V415" fill="none" stroke="#648477" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M468 525V552H90V887" fill="none" stroke="#648477" stroke-width="2.5"/>
<path d="M90 635H145" fill="none" stroke="#648477" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="155" y="590" width="625" height="94" rx="16" fill="#e3ede4" stroke="#cfdbcf"/>
<text x="181" y="628" font-size="29" fill="#193f38" font-weight="700" text-anchor="start">确定性处理</text>
<text x="181" y="664" font-size="25" fill="#61766c" font-weight="400" text-anchor="start">查询交易、计算金额、队列流转</text>
<path d="M90 761H145" fill="none" stroke="#648477" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="155" y="716" width="625" height="94" rx="16" fill="#e3ede4" stroke="#cfdbcf"/>
<text x="181" y="754" font-size="29" fill="#193f38" font-weight="700" text-anchor="start">LLM 起草</text>
<text x="181" y="790" font-size="25" fill="#61766c" font-weight="400" text-anchor="start">基于核验事实组织回复，校验后交付</text>
<path d="M90 887H145" fill="none" stroke="#648477" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="155" y="842" width="625" height="94" rx="16" fill="#f5ead8" stroke="#cfdbcf"/>
<text x="181" y="880" font-size="29" fill="#193f38" font-weight="700" text-anchor="start">人工复核</text>
<text x="181" y="916" font-size="25" fill="#61766c" font-weight="400" text-anchor="start">证据冲突、信息不足或需人工确认</text>
<text x="40" y="976" font-size="23" fill="#61766c" font-weight="400" text-anchor="start">分流正确，也不代表交易事实已经核验或操作已经获准。</text>
</g></svg>